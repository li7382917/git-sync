<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Git Sync</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--dim:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--orange:#d29922}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:800px;margin:0 auto;padding:24px}
h1{font-size:24px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px}
h1 span{font-size:14px;color:var(--dim);font-weight:400}
.subtitle{color:var(--dim);font-size:14px;margin-bottom:24px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px}
.card h2{font-size:16px;font-weight:600;margin-bottom:12px}

label{display:block;font-size:13px;color:var(--dim);margin-bottom:4px}
input[type=text]{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;outline:none}
input[type=text]:focus{border-color:var(--accent)}
input[type=text]::placeholder{color:#484f58}

.row{display:flex;gap:12px;align-items:flex-end}
.row .field{flex:1}
.row .btn-col{flex-shrink:0}

.check-row{display:flex;gap:8px;align-items:center;margin-top:8px}
.check-row label{margin:0;font-size:14px;color:var(--text);cursor:pointer}

button{padding:8px 20px;border:none;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;transition:opacity .15s}
button:active{opacity:.8}
.btn-sync{background:var(--green);color:#fff}
.btn-check{background:var(--accent);color:#fff}
.btn-sync:disabled,.btn-check:disabled{opacity:.5;cursor:not-allowed}

.log-area{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;margin-top:12px;max-height:400px;overflow-y:auto;font-family:'SF Mono',Menlo,monospace;font-size:13px;line-height:1.6;display:none}
.log-area.show{display:block}
.log-entry{padding:2px 0}
.log-ok{color:var(--green)}
.log-err{color:var(--red)}
.log-info{color:var(--dim)}
.log-step{color:var(--orange)}
.log-link a{color:var(--accent);text-decoration:none}
.log-link a:hover{text-decoration:underline}

.history{margin-top:24px}
.history h2{font-size:16px;font-weight:600;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
th{color:var(--dim);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
td a{color:var(--accent);text-decoration:none}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:500}
.badge-ok{background:rgba(63,185,80,.15);color:var(--green)}
.badge-err{background:rgba(248,81,73,.15);color:var(--red)}
</style>
</head>
<body>
<div class="container">
  <h1>⟳ Git Sync <span>v0.1</span></h1>
  <p class="subtitle">本地项目 → GitHub（自动创建 repo）</p>

  <div class="card">
    <h2>同步项目</h2>
    <div class="row" style="margin-bottom:10px">
      <div class="field">
        <label for="path">项目路径</label>
        <input type="text" id="path" placeholder="/Users/htli/PyCharmMiscProject/my-project">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="message">Commit Message（可选）</label>
        <input type="text" id="message" placeholder="auto-sync">
      </div>
      <div class="btn-col">
        <button class="btn-sync" id="syncBtn" onclick="doSync()">Sync</button>
      </div>
    </div>
    <div class="check-row">
      <input type="checkbox" id="private"><label for="private">Private repo</label>
    </div>
    <div class="log-area" id="logArea"></div>
  </div>

  <div class="card">
    <h2>检查仓库</h2>
    <div class="row">
      <div class="field">
        <label for="repoName">仓库名称</label>
        <input type="text" id="repoName" placeholder="my-project">
      </div>
      <div class="btn-col">
        <button class="btn-check" id="checkBtn" onclick="doCheck()">Check</button>
      </div>
    </div>
    <div class="log-area" id="checkLog"></div>
  </div>

  <div class="history card" id="historyCard" style="display:none">
    <h2>同步历史</h2>
    <table>
      <thead><tr><th>时间</th><th>项目</th><th>状态</th><th>链接</th></tr></thead>
      <tbody id="historyBody"></tbody>
    </table>
  </div>
</div>

<script>
const history = [];

function log(area, msg, cls='log-info') {
  const el = document.getElementById(area);
  el.classList.add('show');
  el.innerHTML += `<div class="log-entry ${cls}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

function clearLog(area) {
  const el = document.getElementById(area);
  el.innerHTML = '';
  el.classList.remove('show');
}

function addHistory(name, ok, url) {
  const now = new Date().toLocaleTimeString('zh-CN', {hour12:false});
  history.unshift({time:now, name, ok, url});
  const card = document.getElementById('historyCard');
  card.style.display = '';
  const body = document.getElementById('historyBody');
  body.innerHTML = history.map(h => `
    <tr>
      <td>${h.time}</td>
      <td>${h.name}</td>
      <td><span class="badge ${h.ok?'badge-ok':'badge-err'}">${h.ok?'✓ 成功':'✗ 失败'}</span></td>
      <td>${h.url ? `<a href="${h.url}" target="_blank">${h.url}</a>` : '-'}</td>
    </tr>`).join('');
}

async function doSync() {
  const path = document.getElementById('path').value.trim();
  if (!path) return alert('请输入项目路径');
  const message = document.getElementById('message').value.trim();
  const priv = document.getElementById('private').checked;
  const btn = document.getElementById('syncBtn');

  clearLog('logArea');
  btn.disabled = true;
  btn.textContent = 'Syncing...';
  log('logArea', `▸ 开始同步: ${path}`, 'log-info');

  try {
    const resp = await fetch('/sync', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path, message: message || undefined, private: priv})
    });
    const data = await resp.json();

    if (data.steps) {
      data.steps.forEach(s => {
        if (s.startsWith('repo_created')) log('logArea', `✦ ${s}`, 'log-step');
        else if (s.startsWith('push_failed')) log('logArea', `✗ ${s}`, 'log-err');
        else log('logArea', `  ${s}`, 'log-info');
      });
    }

    if (data.ok) {
      log('logArea', `✓ 同步成功`, 'log-ok');
      log('logArea', `<a href="${data.repo}" target="_blank">${data.repo}</a>`, 'log-link');
      addHistory(path.split('/').pop(), true, data.repo);
    } else {
      log('logArea', `✗ 失败: ${data.error || 'unknown'}`, 'log-err');
      addHistory(path.split('/').pop(), false, null);
    }
  } catch(e) {
    log('logArea', `✗ 请求失败: ${e.message}`, 'log-err');
    addHistory(path.split('/').pop(), false, null);
  }
  btn.disabled = false;
  btn.textContent = 'Sync';
}

async function doCheck() {
  const name = document.getElementById('repoName').value.trim();
  if (!name) return alert('请输入仓库名称');
  const btn = document.getElementById('checkBtn');

  clearLog('checkLog');
  btn.disabled = true;
  try {
    const resp = await fetch(`/check/${encodeURIComponent(name)}`);
    const data = await resp.json();
    if (data.exists) {
      log('checkLog', `✓ 仓库存在`, 'log-ok');
      log('checkLog', `<a href="${data.url}" target="_blank">${data.url}</a>`, 'log-link');
    } else {
      log('checkLog', `✗ 仓库不存在: ${name}`, 'log-err');
    }
  } catch(e) {
    log('checkLog', `✗ 请求失败: ${e.message}`, 'log-err');
  }
  btn.disabled = false;
}

document.querySelectorAll('input[type=text]').forEach(el => {
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const btn = el.closest('.card').querySelector('button');
      if (btn) btn.click();
    }
  });
});
</script>
</body>
</html>
